<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProductHub | Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f1f3f6;
            color: #212121;
        }

        /* Header */

        .header {
            background: #0877e8;
            color: white;
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo span {
            color: #ffdf35;
        }

        .search-box {
            display: flex;
            flex: 1;
            max-width: 600px;
        }

        .search-box input {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 5px 0 0 5px;
            font-size: 14px;
        }

        .search-box button {
            padding: 0 20px;
            border: none;
            background: white;
            color: #0877e8;
            cursor: pointer;
            font-size: 19px;
            border-radius: 0 5px 5px 0;
        }

        .admin-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Categories */

        .categories {
            background: white;
            padding: 18px 5%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            box-shadow: 0 2px 5px #ddd;
        }

        .categories button {
            background: transparent;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #333;
        }

        .categories button:hover {
            color: #0877e8;
        }

        /* Main content */

        .container {
            max-width: 1400px;
            width: 94%;
            margin: 28px auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 5px;
            margin-bottom: 22px;
        }

        .welcome h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        .section-heading {
            background: white;
            padding: 22px;
            border-bottom: 1px solid #eee;
        }

        .product-grid {
            background: white;
            padding: 22px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
            border-radius: 0 0 5px 5px;
        }

        /* Product card */

        .product-card {
            border: 1px solid #edf0f4;
            border-radius: 8px;
            padding: 15px;
            background: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 0;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.10);
        }

        .image-container {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            background: #fff;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 9px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .rating {
            display: inline-block;
            background: #168b50;
            color: white;
            padding: 4px 7px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        .category {
            color: #0877e8;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stock {
            color: #168b50;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .out-of-stock {
            color: #dc2626;
        }

        .view-button {
            background: #ffcf28;
            border: none;
            padding: 11px;
            width: 100%;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        .view-button:hover {
            background: #f5bd00;
        }

        .message {
            background: white;
            padding: 45px 20px;
            text-align: center;
            color: #666;
            grid-column: 1 / -1;
        }

        footer {
            background: #172337;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 35px;
        }

        /* Responsive layout */

        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            .header {
                flex-wrap: wrap;
                gap: 12px;
            }

            .logo {
                font-size: 21px;
            }

            .search-box {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }

            .categories {
                gap: 18px;
            }

            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                padding: 12px;
                gap: 12px;
            }

            .image-container {
                height: 150px;
            }

            .product-card {
                padding: 10px;
            }

            .price {
                font-size: 18px;
            }
        }

        @media (max-width: 380px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        🛒 Product<span>Hub</span>
    </div>

    <div class="search-box">
        <input
            type="search"
            id="searchInput"
            placeholder="Search for products..."
            aria-label="Search products">

        <button onclick="loadProducts()" aria-label="Search">
            🔍
        </button>
    </div>

    <a href="/" class="admin-link">Manage Products</a>

</header>

<nav class="categories" id="categoryBar">
    <button onclick="selectCategory('All')">All Categories</button>
</nav>

<main class="container">

    <section class="welcome">
        <h1>Discover Your Favourite Products</h1>
        <p>Explore our collection and find products that suit you.</p>
    </section>

    <section>
        <div class="section-heading">
            <h2 id="sectionTitle">Featured Products</h2>
            <p id="productCount" style="color:#666; margin-top:6px;">
                Loading products...
            </p>
        </div>

        <div class="product-grid" id="productGrid">
            <div class="message">Loading products...</div>
        </div>
    </section>

</main>

<footer>
    ProductHub © 2026 | Online Shopping
</footer>

<script>
    const API_URL = "/products";

    let allProducts = [];
    let selectedCategory = "All";

    async function loadProducts() {
        const grid = document.getElementById("productGrid");

        grid.innerHTML = '<div class="message">Loading products...</div>';

        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Could not load products");
            }

            allProducts = await response.json();

            createCategoryButtons();

            displayProducts();

        } catch (error) {
            console.error(error);

            grid.innerHTML = `
                <div class="message">
                    <h3>Unable to load products</h3>
                    <p>Make sure Spring Boot is running on port 8080.</p>
                </div>
            `;
        }
    }

    function createCategoryButtons() {
        const bar = document.getElementById("categoryBar");

        bar.innerHTML = "";

        const allButton = document.createElement("button");
        allButton.textContent = "All Categories";
        allButton.onclick = () => selectCategory("All");
        bar.appendChild(allButton);

        const categories = [
            ...new Set(
                allProducts
                    .map(product => product.category)
                    .filter(Boolean)
            )
        ];

        categories.forEach(category => {
            const button = document.createElement("button");

            button.textContent = category;
            button.onclick = () => selectCategory(category);

            bar.appendChild(button);
        });
    }

    function selectCategory(category) {
        selectedCategory = category;
        displayProducts();
    }

    function displayProducts() {
        const grid = document.getElementById("productGrid");

        const searchTerm = document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

        const filteredProducts = allProducts.filter(product => {
            const matchesSearch = [
                product.name,
                product.description,
                product.category
            ].some(value =>
                String(value || "")
                    .toLowerCase()
                    .includes(searchTerm)
            );

            const matchesCategory =
                selectedCategory === "All" ||
                product.category === selectedCategory;

            return matchesSearch && matchesCategory;
        });

        document.getElementById("productCount").textContent =
            `${filteredProducts.length} product(s) found`;

        grid.innerHTML = "";

        if (filteredProducts.length === 0) {
            grid.innerHTML = `
                <div class="message">
                    <h3>No products found</h3>
                    <p>Try another search or category.</p>
                </div>
            `;

            return;
        }

        filteredProducts.forEach(product => {
            const card = document.createElement("article");
            card.className = "product-card";

            const imageContainer = document.createElement("div");
            imageContainer.className = "image-container";

            const image = document.createElement("img");
            image.className = "product-image";
            image.alt = product.name || "Product image";
            image.loading = "lazy";

            image.src = product.imageUrl || "";

            image.onerror = () => {
                image.onerror = null;
                image.src = "https://placehold.co/400x300/f1f3f6/555555?text=No+Image";
            };

            imageContainer.appendChild(image);

            const name = document.createElement("h3");
            name.className = "product-name";
            name.textContent = product.name || "Unnamed product";

            const rating = document.createElement("div");
            rating.className = "rating";
            rating.textContent = "★ Product";

            const price = document.createElement("div");
            price.className = "price";
            price.textContent =
                "₹" + Number(product.price || 0).toLocaleString("en-IN");

            const description = document.createElement("p");
            description.className = "description";
            description.textContent =
                product.description || "No description available.";

            const category = document.createElement("p");
            category.className = "category";
            category.textContent =
                "Category: " + (product.category || "Uncategorized");

            const stock = document.createElement("p");
            stock.className =
                Number(product.quantity) > 0
                    ? "stock"
                    : "stock out-of-stock";

            stock.textContent =
                Number(product.quantity) > 0
                    ? "✓ In Stock"
                    : "Out of Stock";

            const button = document.createElement("button");
            button.className = "view-button";
            button.textContent = "View Product";

            button.onclick = () => {
                window.location.href =
                    "/product.html?id=" +
                    encodeURIComponent(product.id);
            };

            card.append(
                imageContainer,
                name,
                rating,
                price,
                description,
                category,
                stock,
                button
            );

            grid.appendChild(card);
        });
    }

    document
        .getElementById("searchInput")
        .addEventListener("input", displayProducts);

    loadProducts();
</script>

</body>
</html>
